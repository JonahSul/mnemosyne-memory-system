name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION_TEST: 22.x

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: |
          pnpm --filter @mnemosyne/core run build
          pnpm --filter @mnemosyne/pubsub run build
          pnpm --filter @mnemosyne/cloudflare run build
          pnpm --filter @mnemosyne/sqlite run build

      - name: Run tests
        run: pnpm test

  docs:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js ${{ env.NODE_VERSION_TEST }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION_TEST }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: |
          pnpm --filter @mnemosyne/core run build
          pnpm --filter @mnemosyne/pubsub run build
          pnpm --filter @mnemosyne/cloudflare run build
          pnpm --filter @mnemosyne/sqlite run build

      - name: Generate API docs
        run: pnpm docs:generate

  publish-dev:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js ${{ env.NODE_VERSION_TEST }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION_TEST }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Bump prerelease version
        id: version
        run: |
          NEW_VER=$(node scripts/version-bump.mjs prerelease | tail -1)
          echo "version=${NEW_VER}" >> "$GITHUB_OUTPUT"

      - name: Build all packages
        run: |
          pnpm --filter @mnemosyne/core run build
          pnpm --filter @mnemosyne/pubsub run build
          pnpm --filter @mnemosyne/cloudflare run build
          pnpm --filter @mnemosyne/sqlite run build

      - name: Publish packages to npm (dev tag)
        run: |
          for pkg in packages/mnemosyne packages/mnemosyne-pubsub packages/mnemosyne-cloudflare packages/mnemosyne-sqlite packages/mnemosyne-mcp; do
            pushd "$pkg"
            pnpm publish --tag dev --no-git-checks --provenance
            popd
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump back to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push
