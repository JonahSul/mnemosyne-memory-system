name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: |
          npm run build --workspace=packages/mnemosyne
          npm run build --workspace=packages/mnemosyne-pubsub
          npm run build --workspace=packages/mnemosyne-cloudflare

      - name: Run tests
        run: npm test
