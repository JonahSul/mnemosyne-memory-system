name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: 22.x
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@12b7ff3796cabd9e0da05c556468eec2f565d246
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

  docs:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@12b7ff3796cabd9e0da05c556468eec2f565d246
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm build

      - name: Generate API docs
        run: pnpm docs:generate

  # Compute the next version, bump all package.json files, commit with
  # [skip ci] (so this bump does NOT re-trigger this workflow), and push a
  # version tag `v<version>` pointing at the bump commit.
  #
  # - dev: only fires when the HEAD commit is a conventional commit
  #   (feat|fix|breaking). Bumps prerelease → vX.Y.Z-dev.N.
  # - main: always fires. Computes bump type from all commits since the
  #   previous git tag. Highest severity (breaking > feat > fix) wins;
  #   defaults to patch if no conventional commits found.
  #
  # The tag points at the bump commit, so the published artifact SHA is
  # immutable and pinned — publish.yml checks out exactly this tag.
  bump-version:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@12b7ff3796cabd9e0da05c556468eec2f565d246
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Determine bump mode
        id: mode
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            # Dev branch: only bump on conventional-commit pushes
            MERGE_MSG=$(git log -1 --pretty=format:'%s')
            if echo "$MERGE_MSG" | grep -qiE "^(feat|fix|breaking change|breaking)"; then
              echo "mode=prerelease" >> "$GITHUB_OUTPUT"
            else
              echo "mode=skip" >> "$GITHUB_OUTPUT"
            fi
          else
            # Main branch: compute bump from all commits since previous tag
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$PREV" ]; then
              RANGE="HEAD"
            else
              RANGE="$PREV..HEAD"
            fi
            # Resolve to the common ancestor if PREV isn't directly reachable
            MERGE_BASE=$(git merge-base "$PREV" HEAD 2>/dev/null || echo "HEAD")
            if [ -n "$MERGE_BASE" ] && [ "$MERGE_BASE" != "HEAD" ]; then
              RANGE="$MERGE_BASE..HEAD"
            fi
            COMMITS=$(git log --pretty=format:'%s' "$RANGE" 2>/dev/null || echo "")
            BUMP="patch"
            if echo "$COMMITS" | grep -qiE "breaking change|BREAKING CHANGE"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qiE "^(feat|feature)(\(.*\))?:"; then
              BUMP="minor"
            elif echo "$COMMITS" | grep -qiE "^(fix)(\(.*\))?:"; then
              BUMP="patch"
            fi
            echo "mode=$BUMP" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (non-feat/fix/breaking on dev)
        if: steps.mode.outputs.mode == 'skip'
        run: echo "Skipping version bump — HEAD is not a feat/fix/breaking commit"

      - name: Bump version
        if: steps.mode.outputs.mode != 'skip'
        id: version
        run: |
          NEW_VER=$(node scripts/version-bump.mjs "${{ steps.mode.outputs.mode }}" | tail -1)
          echo "version=${NEW_VER}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump [skip ci]
        if: steps.mode.outputs.mode != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Create and push version tag
        if: steps.mode.outputs.mode != 'skip'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
