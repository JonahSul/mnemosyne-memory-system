name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: 22.x

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Stage 1: Build + Test (THE GATE)
  # Every push and PR runs this. Nothing proceeds unless this passes.
  # ───────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@12b7ff3796cabd9e0da05c556468eec2f565d246
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

  docs:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@12b7ff3796cabd9e0da05c556468eec2f565d246
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm build

      - name: Generate API docs
        run: pnpm docs:generate

  # ───────────────────────────────────────────────────────────────────────
  # Stage 2: Version + Tag (only on push, not PRs)
  # Gate: needs test → cannot run unless build+test passed.
  #
  # - dev push: always bumps prerelease (vX.Y.Z-dev.N), commits + tags.
  # - main push: computes patch/minor/major from commits since last tag,
  #   commits + tags.
  #
  # The bump commit uses [skip ci] so it doesn't re-trigger this workflow.
  # The tag points at the bump commit → publish.yml fires on the tag.
  # ───────────────────────────────────────────────────────────────────────
  bump-version:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@12b7ff3796cabd9e0da05c556468eec2f565d246
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Determine bump mode
        id: mode
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "dev" ]; then
            echo "mode=prerelease" >> "$GITHUB_OUTPUT"
          else
            # Main: scan commits since the last version tag.
            # Highest severity wins: breaking > feat > fix, default patch.
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$PREV" ]; then
              RANGE=""
            else
              RANGE="$PREV..HEAD"
            fi
            if [ -z "$RANGE" ]; then
              COMMITS=$(git log --pretty=format:'%s')
            else
              COMMITS=$(git log --pretty=format:'%s' "$RANGE")
            fi
            BUMP="patch"
            if echo "$COMMITS" | grep -qi "breaking change"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qiE "^feat"; then
              BUMP="minor"
            fi
            echo "mode=$BUMP" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        id: version
        run: |
          NEW_VER=$(node scripts/version-bump.mjs "${{ steps.mode.outputs.mode }}" | tail -1)
          echo "version=${NEW_VER}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump [skip ci]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Create and push version tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
