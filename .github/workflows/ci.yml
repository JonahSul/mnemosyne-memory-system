name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  merge_group:
    types: [checks_requested]

env:
  NODE_VERSION: 22.x

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Stage 1: Build + Test (THE GATE)
  # Every push and PR runs this. Nothing proceeds unless this passes.
  # ───────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@12b7ff3796cabd9e0da05c556468eec2f565d246
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

  docs:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@12b7ff3796cabd9e0da05c556468eec2f565d246
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm build

      - name: Generate API docs
        run: pnpm docs:generate

  # ───────────────────────────────────────────────────────────────────────
  # Stage 2: Tag (only on push, not PRs, not merge_group)
  # Gate: needs test → cannot run unless build+test passed.
  #
  # Computes the next version and creates a git tag pointing at the CURRENT
  # HEAD commit (the merge commit that was just tested). Does NOT commit
  # anything to the branch — no push back, no [skip ci], no loop risk.
  #
  # publish.yml reads the tag name, injects the version into package.json
  # in-memory, and publishes. The tag is the source of truth for the version.
  #
  # - dev push: prerelease (vX.Y.Z-dev.N).
  # - main push: patch/minor/major from commits since last tag.
  #
  # Loop prevention: the job checks if the computed tag already exists. If
  # it does (e.g. a re-trigger from a prior run), it exits without tagging.
  # ───────────────────────────────────────────────────────────────────────
  bump-version:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@12b7ff3796cabd9e0da05c556468eec2f565d246
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Determine bump mode
        id: mode
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "dev" ]; then
            echo "mode=prerelease" >> "$GITHUB_OUTPUT"
          else
            # Main: scan commits since the last version tag.
            # Highest severity wins: breaking > feat > fix, default patch.
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$PREV" ]; then
              RANGE=""
            else
              RANGE="$PREV..HEAD"
            fi
            if [ -z "$RANGE" ]; then
              COMMITS=$(git log --pretty=format:'%s')
            else
              COMMITS=$(git log --pretty=format:'%s' "$RANGE")
            fi
            BUMP="patch"
            if echo "$COMMITS" | grep -qi "breaking change"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qiE "^feat"; then
              BUMP="minor"
            fi
            echo "mode=$BUMP" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        id: version
        run: |
          NEW_VER=$(node scripts/version-bump.mjs "${{ steps.mode.outputs.mode }}" --compute-only | tail -1)
          echo "version=${NEW_VER}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists (loop guard)
        id: guard
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push version tag
        if: steps.guard.outputs.skip != 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
